# MiniCPM-o 4.5 three-stage deploy on one large-memory GPU.
pipeline: minicpmo_4_5
async_chunk: true
# Native full-duplex shares this profile with /v1/chat/completions. Every other
# duplex_session knob keeps its runtime default.
session_mode: duplex
# Keep the active window aligned with the session and stage capacities below.
# A smaller window serializes first-packet generation for concurrent chat turns.
duplex_session:
  # Matches Stage 0/1 max_num_seqs below.
  max_sessions: 4

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # C6 steady chunk -- the only half of C6 with a reader in this tree
      # (minicpmo_4_5_omni.py). 第 13 项（2026-09-20）：initial_codec_chunk_frames
      # 已在该处理器里实现（首个 payload 用 25 帧、稳态仍 75 帧）。
      codec_chunk_frames: 75
      initial_codec_chunk_frames: 25
      codec_left_context_frames: 3
      # HiFT capture buckets are derived from codec_chunk_frames and
      # codec_left_context_frames. (#5869)
      enable_hift_graph: true
      enable_cfm_graph: true
      cfm_max_graphs: 32
      cfm_graph_bucket_frames: 16

stages:
  - stage_id: 0
    profiler_config:
      profiler: torch
      torch_profiler_dir: /tmp/omni_prof
      torch_profiler_with_stack: false
      torch_profiler_record_shapes: true
      torch_profiler_with_memory: false
    max_num_seqs: 4
    # Leave headroom on the shared GPU for Talker KV + concurrent Code2Wav.
    gpu_memory_utilization: 0.55
    enforce_eager: false
    # Stage-level prefix caching override (the top level stays false for
    # duplex safety; stage0 requests reuse their own prefixes).
    enable_prefix_caching: true
    # N-gram speculative decoding on stage0. async_scheduling must stay false
    # next to it: vLLM's VllmConfig validation rejects the combination.
    async_scheduling: false
    speculative_config:
      method: ngram
      num_speculative_tokens: 14
      prompt_lookup_min: 1
      prompt_lookup_max: 1
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    # Required for MiniCPM interleaved image/audio Daily-Omni packs (~78% recipe).
    # Keep these in YAML so they are applied through --deploy-config.
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      # Daily-Omni MiniCPM pack: up to 64 interleaved image/audio pairs (1fps).
      image: 64
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      # 1.0 for MCQ accuracy; 1.1 can bias short A–D answers.
      repetition_penalty: 1.0

  - stage_id: 1
    profiler_config:
      profiler: torch
      torch_profiler_dir: /tmp/omni_prof
      torch_profiler_with_stack: false
      torch_profiler_record_shapes: true
      torch_profiler_with_memory: false
    max_num_seqs: 4
    # Preserve the checkpoint's full-attention Talker prompt while it fits;
    # native duplex rolls over to a one-chunk window at context capacity.
    # Leave device-level headroom for the colocated HiFi-GAN cuDNN workspace.
    gpu_memory_utilization: 0.15
    enforce_eager: false
    max_num_batched_tokens: 8192
    # Talker context is 4096 (tts_config.max_position_embeddings).
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    # K-step (Talker multi-frame) is injected by code, not configured here:
    # config/stage_config.py adds the stage-1 speculative_config and clears
    # async_scheduling on 910C/A3. K defaults to 8; the environment variable
    # VLLM_OMNI_MINICPMO_TALKER_FRAMES overrides it (1 = off, 16 = max).
    # The 910B family gets nothing (its rejection verifier cannot take K rows).
    #
    # Talker is a single-vocab codec LM. These knobs go to vLLM's Sampler
    # (head_code logits). EOS is tts_config.eos_token_id (num_audio_tokens-1).
    # Values track upstream utils.TTSSamplingParams (min_p/win_size/tau_r are
    # declared there but never read, so they stay out). repetition_penalty is
    # consumed by the Talker, which rescores it over upstream's 16-frame window
    # instead of the Sampler's whole-stream presence penalty.
    # min_tokens is upstream's min_new_token.
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.05
      min_tokens: 50
      stop_token_ids: [1]
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    profiler_config:
      profiler: torch
      torch_profiler_dir: /tmp/omni_prof
      torch_profiler_with_stack: false
      torch_profiler_record_shapes: true
      torch_profiler_with_memory: false
    max_num_seqs: 4
    gpu_memory_utilization: 0.18
    enforce_eager: false
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    # 第 46 项（stage2 多副本）已回退：它实战有效（r44 双副本 c4 −29.8% / c8 −41.7%；
    # r45 三副本 c4 再 −22.8% / c8 再 −11.4%），但**需要多张卡**，多数部署形态是单卡，
    # 强开会导致那些场景起不来。现按"待讨论"处理，配置与数字见
    # perf_opt/optimization_items_checklist.md 的"待讨论"章节；恢复方法就是在这里加回
    # `num_replicas: 2`（模板模式下副本 r 落到卡 r）。
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true

platforms:
  cuda:
    stages:
      - stage_id: 1
        # Full-attention occupancy is bounded by max_num_seqs * max_model_len
        # (4 * 4096 = 16384 tokens). Keep the reported CUDA KV token capacity
        # above that bound because physical-preemption replay is unsupported.
        # The explicit cap leaves device headroom for concurrent Stage 2.
        kv_cache_memory_bytes: 2147483648  # 2 GiB

  npu:
    stages:
      - stage_id: 0
        max_num_seqs: 8
        max_num_batched_tokens: 8192
        compilation_config:
          # T1: full decode-step graph, measured -32.6% RTF vs PIECEWISE on
          # 910B3 (entry_21, cross-card A/B). stage_config also injects this
          # on NPU as a yaml-regression guard; keep the two in sync.
          cudagraph_mode: FULL_DECODE_ONLY
      - stage_id: 1
        # 第 9 项（2026-09-20 验证）：stage1 并发上限 4→8。原先 npu 覆盖块只写了
        # stage0 和 stage2，stage1 沿用基座的 4，这一格是漏配。
        max_num_seqs: 8
        max_num_batched_tokens: 8192
        compilation_config:
          # Full decode-step graph keeps in-graph sampling and K-step
          # expansion (PIECEWISE silently disables them). Identical decode
          # path to FULL_AND_PIECEWISE (which T1 overrode anyway); prefill
          # runs eager either way.
          cudagraph_mode: FULL_DECODE_ONLY
        # Step-level profiling is opt-in and stays off unless asked for:
        # step_prof.py already defaults to OMNI_STEP_PROF=0 (and flush every
        # 200 spans), so pinning those values here was a no-op that only
        # looked like configuration. Set OMNI_STEP_PROF=1 (+ optionally
        # OMNI_STEP_PROF_FLUSH=<n>) when a profile dump is actually wanted.
      - stage_id: 2
        max_num_seqs: 8
        # Stage 2 stays outer-eager and captures only exact-shape CFM DiT
        # estimator kernels through the NPU platform patch.
        additional_config:
          code2wav_enable_npu_graph: true
          code2wav_max_npu_graphs: 64
